
spring.application.name=demo

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=LibraryManagementSystem;encrypt=true;trustServerCertificate=true
spring.datasource.username=library_app
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

logging.level.org.hibernate.tool.schema=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.hibernate.orm.schema=TRACE